name: Build and audit Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.316
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/YfmCompanion.Desktop/YfmCompanion.Desktop.csproj -Raw
          if ($env:RELEASE_TAG -ne "v$($project.Project.PropertyGroup.Version)") { throw 'Tag/version mismatch.' }
      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-docs.txt
      - name: Audit and assemble portable package
        shell: pwsh
        run: ./tools/Publish-Release.ps1
      - name: Upload audited package
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
      - name: Preserve compact audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-evidence
          retention-days: 14
          path: |
            artifacts/release-audit/**/*.log
            artifacts/release-audit/**/release-audit.json
            artifacts/release-audit/**/packaged-self-check.json
            artifacts/release-audit/**/*.trx
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: YFM Fusion Companion ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
